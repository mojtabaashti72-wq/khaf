.authTabs{display:flex;gap:8px;margin-bottom:12px}.authTabs button{flex:1}
.fl{border-top:1px dashed var(--line);padding-top:8px;margin-top:8px}.fl h4{margin:0 0 6px;font-size:14px}

.shareWrap{position:relative;margin-top:10px}

.pg .c{table-layout:auto}

.mini-head{background:#e4eee9;color:#174b40;font-weight:800;padding:5px 7px;border-bottom:1px solid #c8d3d0;font-size:10px}

.utm-type{display:inline-block;border-radius:4px;padding:1px 3px;font-size:7.5px;white-space:nowrap}

.pg .utm-report .coord{direction:ltr;font-variant-numeric:tabular-nums;font-size:7.5px}
.utm-foot{padding:4px 6px;text-align:left;color:#52616b;font-size:8px;border-top:1px solid #e2e6e4}
@media(max-width:700px){.sketch-utm-layout{grid-template-columns:1fr}.sketch-visual img{height:55mm}}

.sigRow{display:flex;justify-content:flex-start;margin-top:12px}.sigRow div{width:52mm;flex:none;border:1px dashed #888;border-radius:8px;min-height:12mm;padding:4px;text-align:center;font-size:10px}
.logoPickWrap{display:none}.themeRow{display:flex;gap:8px}.themeRow button{flex:1}

/* برنامه‌ریزی بازدیدهای میدانی */
.planGrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.planGrid label{margin:0}.planGrid .wide{grid-column:1/-1}
.planGrid input,.planGrid select,.planGrid textarea{width:100%;min-width:0;padding:11px 12px;border:1px solid var(--line);border-radius:13px;background:var(--card2);color:var(--ink);margin-top:5px}
.planActions{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px}.planActions>*{flex:1}
.planTable{min-width:1050px}.planTable th{background:var(--card2);color:var(--mut)}.planTable td{vertical-align:top}.planTable td button{min-height:36px;padding:5px 9px;font-size:12px}
.planBadge{display:inline-block;padding:2px 9px;border-radius:99px;background:var(--seg);font-size:11px;font-weight:800}
@media(max-width:520px){.planGrid{grid-template-columns:1fr}.planGrid .wide{grid-column:auto}}

@media print{@page{size:A4 portrait;margin:8mm}body{background:#fff}header,.foot,.ui,.tabs,#side,#ovl,#mb{display:none!important}main{padding:0;margin:0;max-width:none}.show .pg{display:block;border:0;margin:0;padding:0;max-width:none;min-height:0;max-height:281mm;overflow:hidden;break-after:page}.show .pg img{max-height:70mm;object-fit:contain}.photoAppendix{break-before:page}}
</style>

<style>
:root{--pri:#2e75b6;--ink:#1d2733;--line:#cfd8e3;--bg:#f4f6f8;--card:#ffffff;--warn:#b45309}

*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font-family:Tahoma,"Segoe UI",Arial,sans-serif;font-size:14px;color:var(--ink);background:var(--bg)}
#app{display:flex;flex-direction:column;height:100%}
.bar{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:6px 10px;background:var(--card);border-bottom:1px solid var(--line)}

#q{width:260px;max-width:100%}

/* ---------- search ---------- */
function latin(s){return s.replace(/[\u06f0-\u06f9]/g,function(c){return String(c.charCodeAt(0)-0x06f0);}).replace(/[\u0660-\u0669]/g,function(c){return String(c.charCodeAt(0)-0x0660);}).replace(/\u066b/g,'.').replace(/\u060c/g,',');}
function parseCoord(t){
 t=latin(t.trim());
 var m=t.match(/#map=(\d+)\/(-?\d+(?:\.\d+)?)\/(-?\d+(?:\.\d+)?)/);
 if(m) return {z:+m[1],lat:+m[2],lon:+m[3]};
 m=t.match(/^(-?\d+(?:\.\d+)?)\s*[,;\s]\s*(-?\d+(?:\.\d+)?)(?:\s*[,;\s]\s*(\d+))?$/);
 if(m&&Math.abs(+m[1])<=90&&Math.abs(+m[2])<=180) return {lat:+m[1],lon:+m[2],z:m[3]?+m[3]:17};
 return null;
}

function geocode(text){
 return jget('https://photon.komoot.io/api/?limit=1&q='+encodeURIComponent(text)).then(function(j){
  if(j&&j.features&&j.features.length){var c=j.features[0].geometry.coordinates;return {lat:c[1],lon:c[0],z:17};}
  throw new Error('none');
 }).catch(function(){
  return jget('https://nominatim.openstreetmap.org/search?format=jsonv2&limit=1&accept-language=fa&q='+encodeURIComponent(text)).then(function(j){
   if(j&&j.length) return {lat:+j[0].lat,lon:+j[0].lon,z:17};
   throw new Error('none');
  });
 });
}

function parseUtm(text,ord){
 var rows=[],bad=0,ln=latin(text).split(/\r?\n/),i;
 function isN(s){return /^[+-]?\d+(\.\d+)?$/.test(s);}
 for(i=0;i<ln.length;i++){
  var s=ln[i].trim();if(!s) continue;
  var tk=s.split(/[\t;,\s]+/).filter(function(x){return x;}),nums=[],words=[],lab='',a,b;
  tk.forEach(function(x){if(isN(x)) nums.push(+x); else words.push(x);});
  if(!words.length&&nums.length>=3&&/^\d+$/.test(tk[0])&&Math.abs(nums[0])<100000){lab=tk[0];a=nums[1];b=nums[2];}
  else if(nums.length>=2){a=nums[0];b=nums[1];lab=words.join(' ');}
  else{bad++;continue;}
  var E=ord==='NE'?b:a,N=ord==='NE'?a:b,t;
  if(E>999999&&N<=999999){t=E;E=N;N=t;}
  if(E<100000||E>900000||N<0||N>10000000){bad++;continue;}
